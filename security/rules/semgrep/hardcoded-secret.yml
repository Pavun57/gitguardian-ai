rules:
  - id: hardcoded-aws-key
    patterns:
      - pattern-regex: (?:AKIA|ASIA)[A-Z0-9]{16}
    message: Hardcoded AWS access key ID. Move to environment variables or a secrets manager.
    languages: [generic]
    severity: ERROR
    metadata:
      severity: critical
      category: security

  - id: hardcoded-private-key
    patterns:
      - pattern-regex: -----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----
    message: Private key material committed to the repository.
    languages: [generic]
    severity: ERROR
    metadata:
      severity: critical
      category: security

  - id: hardcoded-generic-secret
    # Credential-named variable assigned a long string literal. Catches keys
    # that aren't in a recognizable vendor format (gitleaks needs known
    # formats/entropy; this catches the rest).
    patterns:
      - pattern-regex: (?i)(?:api[_-]?key|apikey|secret|token|password|passwd|access[_-]?key)["']?\s*[:=]\s*["'][A-Za-z0-9/_+\-.=]{16,}["']
    message: Possible hardcoded secret assigned to a credential-named variable. Move it to an environment variable or secrets manager.
    languages: [generic]
    severity: ERROR
    metadata:
      severity: high
      category: security
