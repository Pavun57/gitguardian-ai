name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gitguardian
          POSTGRES_PASSWORD: gitguardian
          POSTGRES_DB: gitguardian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gitguardian"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://gitguardian:gitguardian@localhost:5432/gitguardian
      REDIS_URL: redis://localhost:6379/0
      MASTER_ENCRYPTION_KEY: ${{ secrets.CI_MASTER_ENCRYPTION_KEY }}
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run alembic upgrade head
      # unit + mocked integration; docker-marked tests run in the scan job
      - run: uv run pytest tests/ -m "not docker and not e2e" -q

  scan-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Pull scanner images
        run: |
          docker pull semgrep/semgrep:1.131.0
          docker pull zricethezav/gitleaks:v8.28.0
      # Dogfood: our own detection eval must stay at 100% / 0 FPs
      - run: uv run python -m evals.metrics.run_eval
      # Eat our own cooking: scan this repo with our own scanners
      - run: uv run pytest tests/integration/test_scanners.py -m docker -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API/worker image
        run: docker build -f infrastructure/docker/Dockerfile.api -t gitguardian/api:ci .
      - name: Build test-runner image
        run: docker build -f infrastructure/docker/Dockerfile.test-runner -t gitguardian/test-runner:ci infrastructure/docker
