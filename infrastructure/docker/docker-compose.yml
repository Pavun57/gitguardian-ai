services:
  # api/dashboard run as host processes via `gitguardian start`; the container
  # variants are only for the full-docker stack (`--profile docker`).
  api:
    profiles: ["docker"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8976:8000"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gitguardian:gitguardian@postgres:5432/gitguardian
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../:/app
      - api-venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  dashboard:
    profiles: ["docker"]
    build:
      context: ../../apps/dashboard
      dockerfile: ../../infrastructure/docker/Dockerfile.dashboard
    ports:
      - "5678:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8976
    depends_on:
      - api

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gitguardian
      POSTGRES_PASSWORD: gitguardian
      POSTGRES_DB: gitguardian
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitguardian"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # --- Langfuse observability (self-hosted; traces stay on your machine) ---
  # UI: http://localhost:3100 — keys auto-provisioned via LANGFUSE_INIT_* below,
  # matching the defaults in .env.example so tracing works out of the box.

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    profiles: ["langfuse"]
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["langfuse"]
    # minio serves top-level dirs as buckets — pre-create the one langfuse
    # uploads trace events to (LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse)
    entrypoint: sh
    command: -c "mkdir -p /data/langfuse && minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - minio-data:/data

  langfuse-web:
    image: langfuse/langfuse:3
    profiles: ["langfuse"]
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://gitguardian:gitguardian@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: gitguardian-dev-nextauth-secret
      SALT: gitguardian-dev-salt
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_MIGRATION_SSL: "false"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: gitguardian
      LANGFUSE_INIT_ORG_NAME: GitGuardian
      LANGFUSE_INIT_PROJECT_ID: gitguardian
      LANGFUSE_INIT_PROJECT_NAME: gitguardian-ai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: gg-lf-public-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: gg-lf-secret-dev
      LANGFUSE_INIT_USER_EMAIL: admin@gitguardian.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin1234
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: ["langfuse"]
    environment:
      DATABASE_URL: postgresql://gitguardian:gitguardian@postgres:5432/langfuse
      SALT: gitguardian-dev-salt
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  minio-data:
  api-venv:
